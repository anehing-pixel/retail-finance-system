# ============================================================================
# RF 边缘限流层（Nginx）· 双层限流的「外层」
#
# 为什么需要外层：网关侧的令牌桶按「路由段 × 客户端 IP」做细粒度配额，
# 但洪峰流量在到达网关之前就会先吃掉连接数与带宽；边缘层按来源 IP 做漏桶，
# 把明显超限的连接在入口就摘掉，避免把后端与数据库一起压垮。
#
# 两层的算法差异（有意为之，不是重复建设）：
#   · 边缘 Nginx：漏桶 + 突发队列（limit_req），粗粒度、来源 IP 维度、连接级；
#   · 网关令牌桶：令牌桶（token bucket），细粒度、路由段 × 客户端 IP、业务感知。
#
# ⚠️ 部署前提（配错就等于限流失效）：
#   网关必须把本层网段登记进 retail.ratelimit.trusted-proxy-cidrs，
#   否则网关看到的来源全是 Nginx 自己 → 所有客户端共享同一个桶 →
#   正常流量被误伤、攻击流量反而共享额度。
#   容器部署时填容器网段（如 172.16.0.0/12），同机部署填 127.0.0.1/32。
#
# 端口登记（R00 §6 / PROGRESS §2）：
#   18076 = 边缘入口（内部网关前置）   18077 = 边缘入口（外部 DMZ 前置）
#   上游：18081 = 内部网关 api-gateway，18091 = 外部 DMZ external-api
#
# 校验：nginx -t -c /path/to/nginx.conf ；启动：nginx -c /path/to/nginx.conf
# ============================================================================

worker_processes  auto;
events {
    worker_connections  8192;
    multi_accept        on;
}

http {
    # ---- 日志：把限流命中状态也记下来（$limit_req_status = REJECTED 表示被限流）----
    log_format rf '$remote_addr - $request_id [$time_local] "$request" $status '
                   'lb=$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                   'rl=$limit_req_status lc=$limit_conn_status';
    access_log  logs/rf_access.log  rf;

    server_tokens off;

    # ---- 边缘限流区（10m 共享内存约可容纳 16 万个来源地址的状态）----
    # 内部入口：按来源 IP 的漏桶
    limit_req_zone  $binary_remote_addr  zone=rf_edge_ip:10m   rate=50r/s;
    # 外部入口：外部机构入站，基线更低、独立分区
    limit_req_zone  $binary_remote_addr  zone=rf_dmz_ip:10m    rate=20r/s;
    # 并发连接上限：同一来源最多 N 条并发连接（防慢连接占满）
    limit_conn_zone $binary_remote_addr  zone=rf_edge_conn:10m;

    upstream retail_gateway {
        server 127.0.0.1:18081;
        keepalive 64;
    }

    upstream retail_dmz {
        server 127.0.0.1:18091;
        keepalive 32;
    }

    # ---- 统一 429 响应体（与系统统一响应结构一致）----
    error_page 429 = @ratelimit_json;

    location @ratelimit_json {
        default_type application/json;
        return 429 '{"code":"RF_GATEWAY_001","message":"请求过于频繁（边缘限流）","data":null,"traceId":"$request_id","details":{"layer":"edge"}}';
    }

    # ========================================================================
    # 内部网关入口
    # ========================================================================
    server {
        listen      18076;
        server_name _;

        client_max_body_size    10m;
        client_body_timeout     30s;
        client_header_timeout   30s;
        keepalive_timeout       65s;
        reset_timedout_connection on;

        location / {
            # burst = 允许的突发请求数（超出即 429）；nodelay = 突发额度立即放行不排队
            limit_req          zone=rf_edge_ip burst=100 nodelay;
            limit_conn         rf_edge_conn 50;
            limit_req_status   429;
            limit_conn_status  429;
            limit_req_log_level warn;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-Id      $request_id;

            proxy_connect_timeout  3s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
            proxy_next_upstream    error timeout http_502 http_503;

            proxy_pass http://retail_gateway;
        }
    }

    # ========================================================================
    # 外部 DMZ 入口（外部机构入站：DMS / 征信机构 / 银行 / 登记机关）
    # ========================================================================
    server {
        listen      18077;
        server_name _;

        client_max_body_size    5m;
        client_body_timeout     30s;
        client_header_timeout   30s;
        keepalive_timeout       65s;
        reset_timedout_connection on;

        location / {
            limit_req          zone=rf_dmz_ip burst=50 nodelay;
            limit_conn         rf_edge_conn 20;
            limit_req_status   429;
            limit_conn_status  429;
            limit_req_log_level warn;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-Id      $request_id;

            proxy_connect_timeout  3s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
            proxy_next_upstream    error timeout http_502 http_503;

            proxy_pass http://retail_dmz;
        }
    }
}
