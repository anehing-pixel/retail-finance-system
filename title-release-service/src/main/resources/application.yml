server:
  port: 8097

spring:
  application:
    name: title-release-service
  datasource:
    # 第一版共库（ADR-RF-009 / R02 §3.1 范式 4）：core | pii | integration | audit 按 schema 分区
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/retail_finance}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: false
  jackson:
    time-zone: Asia/Tokyo
    default-property-inclusion: non_null
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        fail-fast: false

mybatis:
  configuration:
    # 一级缓存降为 STATEMENT 级：与原 JdbcTemplate「每次读都落库」的读语义对齐，
    # 避免同一事务内重复 SELECT 命中 MyBatis SESSION 级本地缓存的旧行
    local-cache-scope: STATEMENT
retail:
  auth:
    # 员工侧 JWT 密钥：生产必须环境变量注入，dev 兜底值绝不进生产
    secret: ${RETAIL_JWT_SECRET:dev-only-retail-staff-secret-change-me-in-prod-0123456789}
    token-hours: ${RETAIL_TOKEN_HOURS:8}
  customer-auth:
    # 客户侧独立密钥（三把密钥互不相同，R00 §6）；验签器 W3 接入 customer-service
    secret: ${RETAIL_CUSTOMER_JWT_SECRET:dev-only-retail-customer-secret-change-me-in-prod-01234}
  lock:
    # 分布式锁（ADR-RF-015）：Redis 是受保护写路径的硬依赖——Redis 不可达即 fail-closed 拒绝写
    redis:
      address: ${RETAIL_LOCK_REDIS_ADDRESS:redis://127.0.0.1:6381}
      connect-timeout-ms: ${RETAIL_LOCK_CONNECT_TIMEOUT_MS:3000}
      timeout-ms: ${RETAIL_LOCK_TIMEOUT_MS:3000}
      retry-attempts: ${RETAIL_LOCK_RETRY_ATTEMPTS:0}
    # 抢锁等待上限：超时按并发冲突拒绝（RF_LOCK_001）
    wait-time-ms: ${RETAIL_LOCK_WAIT_MS:3000}
  clients:
    # Feign 门禁双模 URI（R09 §7.2）：空串回退 lb://，本地无注册中心用环境变量直连
    contract:
      url: ${RETAIL_CLIENTS_CONTRACT_URL:}
    customer:
      url: ${RETAIL_CLIENTS_CUSTOMER_URL:}
    underwriting:
      url: ${RETAIL_CLIENTS_UNDERWRITING_URL:}
  mq:
    # MQ 削峰通道（ADR-RF-014）：默认关闭 → 走同步路径，行为与现网逐字一致；
    # 打开后「控制器把含个人信息的载荷封成密文信封投进 MQ」，消费端解密后执行同一 handler。
    enabled: ${RETAIL_MQ_ENABLED:false}
    # 信封数据密钥：为空时回落 retail.pii.data-key（不新增密钥面，R06 §5）
    data-key: ${RETAIL_MQ_DATA_KEY:}
    key-version: ${RETAIL_MQ_KEY_VERSION:v1}
    name-server: ${RETAIL_MQ_NAME_SERVER:127.0.0.1:9876}
    producer-group: rf-title-release
    consumer-group: rf-title-release
    # 削峰旋钮：消费侧限速（并发消费线程 / 单次拉取条数）
    consume-thread-max: ${RETAIL_MQ_CONSUME_THREADS:20}
    pull-batch-size: ${RETAIL_MQ_PULL_BATCH:16}
    # 通用中继：本服务是否由 RF_EVENT_RELAY 接管事件消费（打开后直投让位）
    relay-consumer-enabled: ${RETAIL_MQ_RELAY_ENABLED:false}
    # 仍走直投的消费者白名单（秒级刚性事件，如同意撤回，不进 MQ 延迟通道）
    direct-consumers: ${RETAIL_MQ_DIRECT_CONSUMERS:}
    # 附件走密文通道的单文件上限（超过则回落同步落盘；base64 膨胀约 1/3，
    # RocketMQ 单消息默认上限 4MB）
    attachment:
      max-inline-bytes: ${RETAIL_MQ_ATTACHMENT_MAX_INLINE_BYTES:2097152}

  attachments:
    # 附件本地文件系统存储（ADR-RF-008：只用本地实现，不引入 S3/MinIO）
    base-dir: ${RETAIL_ATTACHMENTS_BASE_DIR:data/attachments}
    max-size-bytes: ${RETAIL_ATTACHMENTS_MAX_SIZE_BYTES:10485760}
    token-secret: ${RETAIL_ATTACHMENTS_TOKEN_SECRET:dev-only-local-attachment-token}
