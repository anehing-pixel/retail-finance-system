server:
  port: 18091                    # 外部 DMZ 独立端口（R00 §6：/external/** 不经过内部网关 18081）

spring:
  application:
    name: external-api
  datasource:
    # 第一版共库（ADR-RF-009）：W9-B 起 nonce 防重放 / call_logs 留痕 / partner 档案
    # 走 integration.* 表（R06 §integration）
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/retail_finance}
    # 运行期受限角色（R11 P0-1 / G-DB-2）：DMZ 用 retail_dmz_rw；禁止 postgres 超管
    username: ${SPRING_DATASOURCE_USERNAME:retail_dmz_rw}
    password: ${RETAIL_DB_DMZ_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: false               # 迁移由部署脚本按序执行（条数以 infrastructure 迁移目录为准），服务启动不接管
  jackson:
    time-zone: Asia/Tokyo
    default-property-inclusion: non_null
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        fail-fast: false

mybatis:
  configuration:
    # 一级缓存降为 STATEMENT 级：与原 JdbcTemplate「每次读都落库」的读语义对齐，
    # 避免同一事务内重复 SELECT 命中 MyBatis SESSION 级本地缓存的旧行
    local-cache-scope: STATEMENT
retail:
  auth:
    # 员工侧 JWT 密钥（W-SIM）：DMZ 转发内部 API 时签系统服务 token（svc-external-dmz），
    # 与其他服务同一真相源；无默认值，缺失即启动失败（R11 P0-8）
    secret: ${RETAIL_JWT_SECRET}
  customer-auth:
    # 客户侧独立密钥（RfSecurityConfig 无条件装配双主体验签器）
    secret: ${RETAIL_CUSTOMER_JWT_SECRET}
  lock:
    # 分布式锁（ADR-RF-015）：Redis 是受保护写路径的硬依赖——Redis 不可达即 fail-closed 拒绝写
    redis:
      address: ${RETAIL_LOCK_REDIS_ADDRESS:redis://127.0.0.1:6381}
      connect-timeout-ms: ${RETAIL_LOCK_CONNECT_TIMEOUT_MS:3000}
      timeout-ms: ${RETAIL_LOCK_TIMEOUT_MS:3000}
      retry-attempts: ${RETAIL_LOCK_RETRY_ATTEMPTS:0}
    # 抢锁等待上限：超时按并发冲突拒绝（RF_LOCK_001）
    wait-time-ms: ${RETAIL_LOCK_WAIT_MS:3000}
  clients:
    title-release:
      # DMZ 入站转发直连（双模范式，R09 §7.2）：登记回执 → title-release 回执登记
      url: ${RETAIL_CLIENTS_TITLE_RELEASE_URL:http://127.0.0.1:8097}
  dmz:
    # W9-B 三关开关：生产默认开（ip-allowlist-enabled 置 true + trust-forwarded-for 视 LB 拓扑）
    registry-mode: ${RETAIL_DMZ_REGISTRY_MODE:CONFIG}   # CONFIG=配置档案（W2 口径）/ DB=integration.partners 表
    nonce-enabled: true                                  # nonce 写 integration.nonces 防重放
    nonce-retention-seconds: 600                         # 过期 nonce 惰性清理（2×时间戳容差）
    scope-enabled: true                                  # partner scope 校验，超出 → 403
    ip-allowlist-enabled: ${RETAIL_DMZ_IP_ALLOWLIST_ENABLED:false}  # 全局 IP 白名单开关（默认关）
    trust-forwarded-for: false                           # 仅在可信 LB 前置时开启（防 XFF 伪造绕过）
  integration:
    partners:
      # dev partner 密钥：生产真相源是 integration.partner_credentials.secret_ref（不明文、走密钥管理设施）
      DMS-DEV-01:
        secret: ${RETAIL_PARTNER_DMS_SECRET:dev-dms-partner-secret-0123456789}
        # CONFIG 模式档案：scope（路由键）与 IP 白名单；DB 模式以 integration.partners 为准
        scopes:
          - echo
        ip-allowlist: ${RETAIL_PARTNER_DMS_IP_ALLOWLIST:}
      # 登记机关模拟器（W-SIM，R07 I-10/P-13 入站）：回执回调走 /external/registry/receipts
      REG-SIM-01:
        secret: ${RETAIL_PARTNER_REG_SECRET:dev-registry-sim-secret-0123456789}
        scopes:
          - registry_receipts
        ip-allowlist: ${RETAIL_PARTNER_REG_IP_ALLOWLIST:}
