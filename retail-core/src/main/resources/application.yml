server:
  port: 8090

spring:
  application:
    name: retail-core
  datasource:
    # 第一版共库（ADR-RF-009 / R02 §3.1 范式 4）：core | pii | integration | audit 按 schema 分区
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/retail_finance}
    # 运行期受限角色（R11 P0-1 / G-DB-2）：禁止 postgres 超管；口令由环境变量注入，无默认值
    username: ${SPRING_DATASOURCE_USERNAME:retail_app_rw}
    password: ${RETAIL_DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    # 迁移账号与运行账号分离（R11 P0-1 / G-DB-3）：Flyway 用 owner/超管，运行期用 retail_app_rw
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/retail_finance}
    user: ${RETAIL_DB_MIGRATION_USER:postgres}
    password: ${RETAIL_DB_MIGRATION_PASSWORD}
    # 全仓只有 retail-core 跑 Flyway（R00 §7）；迁移脚本在 retail-infrastructure jar 内
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Tokyo
    default-property-inclusion: non_null
  data:
    redis:
      # L2 分布式缓存 + 网关令牌桶共用同一实例（端口登记见 PROGRESS §2）
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6382}
      connect-timeout: 2s
      timeout: 2s
      lettuce:
        pool:
          enabled: false
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        fail-fast: false

mybatis:
  configuration:
    # 一级缓存降为 STATEMENT 级：与原 JdbcTemplate「每次读都落库」的读语义对齐，
    # 避免同一事务内重复 SELECT 命中 MyBatis SESSION 级本地缓存的旧行
    local-cache-scope: STATEMENT
retail:
  cache:
    # 两级缓存：L1 Caffeine（短 TTL）+ L2 Redis（主动失效为主，TTL 兜底）
    enabled: ${RETAIL_CACHE_ENABLED:true}
    key-prefix: "rf:"
    l1-ttl: 10s
    l2-ttl: 60s
    l1-max-size: 1000
  core:
    # 银行代付网关双模（W-SIM2，P-09）：空=挡板（同步假成功），非空=HTTP 对端（机构模拟器/真实银行）
    bank-pay-url: ${RETAIL_CORE_BANK_PAY_URL:}
  auth:
    # 员工侧 JWT 密钥：无默认值，缺失即启动失败（R11 P0-8；本地由 scripts/dev-secrets.sh 注入）
    secret: ${RETAIL_JWT_SECRET}
    token-hours: ${RETAIL_TOKEN_HOURS:8}
  customer-auth:
    # 客户侧独立密钥（三把密钥互不相同，R00 §6）；验签器 W3 接入 customer-service
    secret: ${RETAIL_CUSTOMER_JWT_SECRET}
  clients:
    # Feign 门禁双模 URI（R09 §7.2）：空串回退 lb://，本地无注册中心用环境变量直连
    contract:
      url: ${RETAIL_CLIENTS_CONTRACT_URL:}
    customer:
      url: ${RETAIL_CLIENTS_CUSTOMER_URL:}
    underwriting:
      url: ${RETAIL_CLIENTS_UNDERWRITING_URL:}
  mq:
    # MQ 削峰通道（ADR-RF-014）：默认关闭 → 走同步路径，行为与现网逐字一致；
    # 打开后「控制器把含个人信息的载荷封成密文信封投进 MQ」，消费端解密后执行同一 handler。
    enabled: ${RETAIL_MQ_ENABLED:false}
    # 信封数据密钥：为空时回落 retail.pii.data-key（不新增密钥面，R06 §5）
    data-key: ${RETAIL_MQ_DATA_KEY:}
    key-version: ${RETAIL_MQ_KEY_VERSION:v1}
    name-server: ${RETAIL_MQ_NAME_SERVER:127.0.0.1:9876}
    producer-group: rf-core
    consumer-group: rf-core
    # 削峰旋钮：消费侧限速（并发消费线程 / 单次拉取条数）
    consume-thread-max: ${RETAIL_MQ_CONSUME_THREADS:20}
    pull-batch-size: ${RETAIL_MQ_PULL_BATCH:16}
    # 通用中继：本服务是否由 RF_EVENT_RELAY 接管事件消费（打开后直投让位）
    relay-consumer-enabled: ${RETAIL_MQ_RELAY_ENABLED:false}
    # 仍走直投的消费者白名单（秒级刚性事件，如同意撤回，不进 MQ 延迟通道）
    direct-consumers: ${RETAIL_MQ_DIRECT_CONSUMERS:}
    # 通用中继生产端（仅 retail-core 承担，避免多实例重复中继）
    relay-enabled: ${RETAIL_MQ_RELAY_ENABLED:false}
    relay-interval-ms: ${RETAIL_MQ_RELAY_INTERVAL_MS:1000}
    relay-batch-limit: ${RETAIL_MQ_RELAY_BATCH_LIMIT:100}

  jobs:
    # 日批调度开关（W9-C；retail.jobs.* 统一命名，与 servicing 同风格）
    schedule-enabled: ${RETAIL_JOBS_SCHEDULE_ENABLED:false}
    schedule-cron: ${RETAIL_JOBS_SCHEDULE_CRON:0 0 3 * * *}
    stale-minutes: ${RETAIL_JOBS_STALE_MINUTES:30}
