server:
  port: 8095

spring:
  application:
    name: bureau-service
  datasource:
    # 第一版共库（ADR-RF-009 / R02 §3.1 范式 4）：core | pii | integration | audit 按 schema 分区
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/retail_finance}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: false
  jackson:
    time-zone: Asia/Tokyo
    default-property-inclusion: non_null
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        fail-fast: false

mybatis:
  configuration:
    # 一级缓存降为 STATEMENT 级：与原 JdbcTemplate「每次读都落库」的读语义对齐，
    # 避免同一事务内重复 SELECT 命中 MyBatis SESSION 级本地缓存的旧行
    local-cache-scope: STATEMENT
retail:
  bureau:
    # 报送日批开关（默认 false=不跑）与 cron（默认每日 08:00 JST；C-05 T+1 口径）
    report-schedule-enabled: ${RETAIL_BUREAU_REPORT_SCHEDULE_ENABLED:false}
    report-cron: ${RETAIL_BUREAU_REPORT_CRON:0 0 8 * * *}
    # CIC 对端双模（W-SIM）：空=挡板 CicStubAdapter；配 URL 走 HttpCicAdapter
    # （提议协议 v1 §4.7/§4.8/§4.9 报文，对端可为外部机构模拟器 external-simulator）
    cic-url: ${RETAIL_BUREAU_CIC_URL:}
  auth:
    # 员工侧 JWT 密钥：无默认值，缺失即启动失败（R11 P0-8；本地由 scripts/dev-secrets.sh 注入）
    secret: ${RETAIL_JWT_SECRET}
    token-hours: ${RETAIL_TOKEN_HOURS:8}
  customer-auth:
    # 客户侧独立密钥（三把密钥互不相同，R00 §6）；验签器 W3 接入 customer-service
    secret: ${RETAIL_CUSTOMER_JWT_SECRET}
  clients:
    # Feign 门禁双模 URI（R09 §7.2）：空串回退 lb://，本地无注册中心用环境变量直连
    contract:
      url: ${RETAIL_CLIENTS_CONTRACT_URL:}
    customer:
      url: ${RETAIL_CLIENTS_CUSTOMER_URL:}
    underwriting:
      url: ${RETAIL_CLIENTS_UNDERWRITING_URL:}
  mq:
    # MQ 削峰通道（ADR-RF-014）：默认关闭 → 走同步路径，行为与现网逐字一致；
    # 打开后「控制器把含个人信息的载荷封成密文信封投进 MQ」，消费端解密后执行同一 handler。
    enabled: ${RETAIL_MQ_ENABLED:false}
    # 信封数据密钥：为空时回落 retail.pii.data-key（不新增密钥面，R06 §5）
    data-key: ${RETAIL_MQ_DATA_KEY:}
    key-version: ${RETAIL_MQ_KEY_VERSION:v1}
    name-server: ${RETAIL_MQ_NAME_SERVER:127.0.0.1:9876}
    producer-group: rf-bureau
    consumer-group: rf-bureau
    # 削峰旋钮：消费侧限速（并发消费线程 / 单次拉取条数）
    consume-thread-max: ${RETAIL_MQ_CONSUME_THREADS:20}
    pull-batch-size: ${RETAIL_MQ_PULL_BATCH:16}
    # 通用中继：本服务是否由 RF_EVENT_RELAY 接管事件消费（打开后直投让位）
    relay-consumer-enabled: ${RETAIL_MQ_RELAY_ENABLED:false}
    # 仍走直投的消费者白名单（秒级刚性事件，如同意撤回，不进 MQ 延迟通道）
    direct-consumers: ${RETAIL_MQ_DIRECT_CONSUMERS:}

